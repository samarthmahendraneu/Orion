apiVersion: v1
kind: PersistentVolume
metadata:
  name: orion-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/data/orion-workspace"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orion-workspace-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
